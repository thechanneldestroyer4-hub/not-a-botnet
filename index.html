<script>
// ============================================================
// PROCEDURAL AD GENERATION ENGINE
// ============================================================
const AD_ID = '2451844';
const AD_BASE = 'https://acceptable.a-ads.com/' + AD_ID + '/';

const AD_SIZES = [
  {w:728,h:90,label:'728x90'},
  {w:468,h:60,label:'468x60'},
  {w:300,h:250,label:'300x250'},
  {w:160,h:600,label:'160x600'},
  {w:320,h:50,label:'320x50'},
  {w:970,h:90,label:'970x90'},
  {w:250,h:250,label:'250x250'},
  {w:200,h:200,label:'200x200'},
  {w:336,h:280,label:'336x280'},
  {w:120,h:600,label:'120x600'},
  {w:180,h:150,label:'180x150'},
  {w:300,h:600,label:'300x600'}
];

let adCount = 0;
function bumpCounter(){
  adCount++;
  const el = document.getElementById('ad-counter');
  if(el) el.textContent = 'ADS LOADED: ' + adCount;
}

function makeAdIframe(size, key){
  const src = AD_BASE + '?size=' + size.label + (key ? '&key=' + key : '');
  const ifr = document.createElement('iframe');
  ifr.setAttribute('data-aa', AD_ID);
  ifr.src = src;
  ifr.style.cssText = 'border:0;padding:0;margin:0;display:block;overflow:hidden;background:transparent;width:'+size.w+'px;height:'+size.h+'px;max-width:100%';
  ifr.setAttribute('scrolling','no');
  ifr.setAttribute('loading','lazy');
  ifr.title = 'Advertisement';
  return ifr;
}

function spawnAdBox(target, sizeOpts){
  const size = sizeOpts || AD_SIZES[Math.floor(Math.random()*AD_SIZES.length)];
  const key = 'b' + adCount;
  const box = document.createElement('div');
  box.className = 'ad-box';
  box.style.maxWidth = (size.w + 20) + 'px';
  box.style.width = '100%';
  const lbl = document.createElement('div');
  lbl.className = 'ad-label';
  lbl.textContent = 'Advertisement';
  box.appendChild(lbl);
  box.appendChild(makeAdIframe(size, key));
  target.appendChild(box);
  bumpCounter();
  return box;
}

function spawnFullWidthAd(target, sizeLabel){
  const size = AD_SIZES.find(s=>s.label===sizeLabel) || AD_SIZES[0];
  const wrap = document.createElement('div');
  wrap.className = 'ad-wrap-full';
  const inner = document.createElement('div');
  inner.className = 'ad-box';
  inner.style.background = 'transparent';
  inner.style.border = '0';
  inner.style.padding = '0';
  inner.style.maxWidth = (size.w + 20) + 'px';
  inner.style.width = '100%';
  const lbl = document.createElement('div');
  lbl.className = 'ad-label';
  lbl.textContent = 'Advertisement';
  inner.appendChild(lbl);
  inner.appendChild(makeAdIframe(size, 'fw' + adCount));
  wrap.appendChild(inner);
  target.appendChild(wrap);
  bumpCounter();
  return wrap;
}

function spawnInlineAd(target, sizeLabel){
  const size = sizeLabel
    ? AD_SIZES.find(s=>s.label===sizeLabel)
    : AD_SIZES[Math.floor(Math.random()*6)];
  const wrap = document.createElement('div');
  wrap.className = 'ad-inline';
  const box = document.createElement('div');
  box.className = 'ad-box';
  box.style.maxWidth = (size.w + 20) + 'px';
  const lbl = document.createElement('div');
  lbl.className = 'ad-label';
  lbl.textContent = 'Advertisement';
  box.appendChild(lbl);
  box.appendChild(makeAdIframe(size, 'in' + adCount));
  wrap.appendChild(box);
  target.appendChild(wrap);
  bumpCounter();
  return wrap;
}

function spawnFloatingAd(){
  const slot = document.getElementById('floating-ad-slot');
  if(!slot) return;
  slot.innerHTML = '';
  const close = document.createElement('div');
  close.className = 'close-btn';
  close.textContent = '×';
  close.onclick = () => {
    slot.style.display = 'none';
    setTimeout(spawnFloatingAd, 25000);
  };
  const lbl = document.createElement('div');
  lbl.className = 'ad-label';
  lbl.textContent = 'Advertisement';
  const ifr = makeAdIframe(AD_SIZES.find(s=>s.label==='300x250'), 'fl' + adCount);
  slot.appendChild(close);
  slot.appendChild(lbl);
  slot.appendChild(ifr);
  slot.style.display = 'block';
  bumpCounter();
}

function spawnInterstitial(){
  const ov = document.getElementById('interstitial');
  if(!ov) return;
  ov.innerHTML = '';
  ov.style.display = 'flex';
  const lbl = document.createElement('div');
  lbl.className = 'ad-label';
  lbl.style.fontSize = '12px';
  lbl.textContent = 'Sponsored Content';
  const box = document.createElement('div');
  box.className = 'ad-box';
  box.style.background = 'transparent';
  box.style.border = '0';
  box.appendChild(makeAdIframe(AD_SIZES.find(s=>s.label==='336x280'), 'is' + adCount));
  const skip = document.createElement('button');
  skip.className = 'skip-btn disabled';
  skip.textContent = 'Skip in 5…';
  let n = 5;
  const iv = setInterval(()=>{
    n--;
    if(n<=0){
      clearInterval(iv);
      skip.textContent = 'Skip Ad →';
      skip.classList.remove('disabled');
      skip.onclick = () => { ov.style.display = 'none'; };
    } else {
      skip.textContent = 'Skip in ' + n + '…';
    }
  }, 1000);
  ov.appendChild(lbl);
  ov.appendChild(box);
  ov.appendChild(skip);
  bumpCounter();
}

function fillSidebars(){
  const left = document.getElementById('left-sidebar-ads');
  const right = document.getElementById('right-sidebar-ads');
  if(left){
    left.innerHTML = '';
    spawnAdBox(left, AD_SIZES.find(s=>s.label==='160x600'));
    spawnAdBox(left, AD_SIZES.find(s=>s.label==='160x600'));
  }
  if(right){
    right.innerHTML = '';
    spawnAdBox(right, AD_SIZES.find(s=>s.label==='160x600'));
    spawnAdBox(right, AD_SIZES.find(s=>s.label==='120x600'));
  }
}

function fillAdZones(){
  // full-width top
  const top = document.getElementById('top-ad-slot');
  if(top && !top.dataset.filled){
    top.innerHTML = '';
    spawnFullWidthAd(top, '728x90');
    top.dataset.filled = '1';
  }
  // in-content zones
  document.querySelectorAll('[data-ad-zone]').forEach(zone => {
    if(zone.dataset.filled) return;
    zone.innerHTML = '';
    const sizes = ['728x90','300x250','468x60','336x280'];
    const pick = sizes[Math.floor(Math.random()*sizes.length)];
    spawnInlineAd(zone, pick);
    zone.dataset.filled = '1';
  });
}

  <section>
    <h2>Welcome to notabotnet.site</h2>

    <div class="grid">
      <article class="card"><h3>Just a joke</h3><p>The phrase "you just got botnetted boiiii" is intentionally dramatic. Visiting this page does not install a botnet.</p></article>
      <article class="card"><h3>Actually useful</h3><p>The rest of the site explains what a botnet really is, why botnets matter, and a few simple ways to protect yourself online.</p></article>
      <article class="card"><h3>No mystery downloads</h3><p>This page is ordinary HTML, CSS, and browser-side JavaScript. There is no executable download hidden behind the joke.</p></article>
      <article class="card"><h3>Human-readable</h3><p>The site is designed to be understandable rather than pretending to be a security scanner or an infection warning.</p></article>
    </div>
    <div data-ad-zone="after-grid"></div>
    <h3>What you'll find here</h3>
    <p>Beyond the joke, this site is structured into several pages. Each one explains a small piece of internet security in plain language, and each one is decorated with advertisements because that's apparently how the internet works now.</p>

    <div data-ad-zone="after-text-1"></div>

    <div data-ad-zone="after-text-2"></div>
    <h3>A note on the ads</h3>
    <p>Every advertisement on this site is a real ad unit served through a third-party network. We don't write the ad content, we don't pick the advertisers, and we definitely don't endorse whatever they're selling. The ads exist because hosting costs money and this seemed like the least annoying way to cover it. That plan may have backfired.</p>

botnets: () => `
  <section>
    <h2>So what actually is a botnet?</h2>
    <p>A botnet is a collection of internet-connected devices that have been compromised and are being controlled or coordinated by someone else. Botnets can be used for things such as distributed denial of service attacks, spam, credential attacks, or other abusive activity.</p>
    <div data-ad-zone="top"></div>

    <p>A typical botnet has three parts: the bots themselves (compromised devices), a command-and-control server (where the operator sends instructions), and a payload (the actual malicious task). Some modern botnets use peer-to-peer communication to avoid relying on a single server.</p>
    <div data-ad-zone="mid-2"></div>
    <h3>What botnets do</h3>
    <ul>
      <li><strong>DDoS attacks:</strong> flooding a target with traffic until it can't respond.</li>
      <li><strong>Spam campaigns:</strong> sending millions of emails from compromised machines.</li>

      <li><strong>Cryptomining:</strong> using someone else's CPU/GPU to mine cryptocurrency.</li>
      <li><strong>Proxying:</strong> routing traffic through compromised devices to hide the origin.</li>

protection: () => `
  <section>

// ROUTER
// ============================================================
let lastRoute = null;
let interstitialShownFor = new Set();

function router(){
  const hash = (location.hash || '#/home').replace('#/','');
  const route = hash.split('/')[0];
  const sub = hash.split('/')[1];
  const app = document.getElementById('app');

  // active nav state
  document.querySelectorAll('nav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.route === route);
  });

  // render page
  if(route === 'blog' && sub && BLOG_POSTS[sub]){
    app.innerHTML = BLOG_POSTS[sub];
  } else if(PAGES[route]){
    app.innerHTML = PAGES[route]();
  } else {
    app.innerHTML = PAGES.home();
  }

  // reset ad zones
  document.querySelectorAll('[data-ad-zone]').forEach(z=>delete z.dataset.filled);
  // fill ads in new content
  fillAdZones();
  fillSidebars();

  // blog post click handlers
  document.querySelectorAll('.blog-item').forEach(item=>{
    item.onclick = () => { location.hash = '#/blog/' + item.dataset.blog; };
  });

  // load-more-ads button
  const lm = document.getElementById('load-more-ads-btn');
  if(lm){
    lm.onclick = () => {
      const zone = document.getElementById('extra-ads-zone');
      if(!zone) return;
      for(let i=0;i<5;i++){
        const wrap = document.createElement('div');
        wrap.style.margin = '24px 0';
        zone.appendChild(wrap);
        spawnAdBox(wrap);
      }
      zone.scrollIntoView({behavior:'smooth', block:'end'});
    };
  }

  // route links
  document.querySelectorAll('[data-route]').forEach(a=>{
    if(a.tagName === 'A' || a.tagName === 'BUTTON') return;
    a.style.cursor = 'pointer';
    a.onclick = (e)=>{
      e.preventDefault();
      location.hash = '#/' + a.dataset.route;
    };
  });

  // interstitial between route changes (but not on first load)
  if(lastRoute && lastRoute !== route && !interstitialShownFor.has(route)){
    interstitialShownFor.add(route);
    spawnInterstitial();
  }
  lastRoute = route;

  window.scrollTo(0,0);
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('hashchange', router);
window.addEventListener('load', () => {
  if(!location.hash) location.hash = '#/home';
  router();
  spawnFloatingAd();
  // periodic floating ad refresh every 60s if dismissed
  setInterval(()=>{
    const f = document.getElementById('floating-ad-slot');
    if(f && f.style.display === 'none') spawnFloatingAd();
  }, 60000);
});
</script>
</body>
