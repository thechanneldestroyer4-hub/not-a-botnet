<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notabotnet.site</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #050505; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    body { overflow-x: hidden; }

    .ad-wall {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      background: #090909;
    }

    .ad-box {
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      border: 1px solid #151515;
      overflow: hidden;
    }

    .ad-box > div {
      width: 100%;
      margin: auto;
      position: relative;
      z-index: 99998;
    }

    .ad-box iframe {
      border: 0;
      padding: 0;
      width: 70%;
      height: auto;
      min-height: 90px;
      overflow: hidden;
      display: block;
      margin: auto;
    }

    .hero {
      min-height: 72vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 20px;
      text-align: center;
      background:
        radial-gradient(circle at center, rgba(147, 51, 234, 0.14), transparent 42%),
        #050505;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 110px);
      line-height: .9;
      letter-spacing: -0.055em;
      font-weight: 900;
      text-transform: uppercase;
    }

    .hero .purple {
      color: #a855f7;
      text-shadow: 0 0 14px rgba(168, 85, 247, .75), 0 0 48px rgba(168, 85, 247, .3);
    }

    .hero p {
      margin: 26px 0 0;
      color: #888;
      font-size: 18px;
    }

    footer {
      padding: 40px 20px 60px;
      text-align: center;
      color: #3e3e3e;
      font-size: 12px;
      background: #050505;
    }

    @media (max-width: 1100px) {
      .ad-wall { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      .ad-wall { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 6px; }
      .ad-box iframe { width: 90%; }
      .ad-box { min-height: 100px; }
    }

    @media (max-width: 430px) {
      .ad-wall { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="top-ads" class="ad-wall"></div>

  <main class="hero">
    <div>
      <h1>YOU JUST GOT<br><span class="purple">BOTNETTED BOIIII</span></h1>
      <p>welcome to notabotnet.site</p>
    </div>
  </main>

  <div id="bottom-ads" class="ad-wall"></div>

  <footer>notabotnet.site</footer>

  <script>
    // Number of real A-ADS units rendered on the page.
    const TOTAL_ADS = 100;

    function createAd() {
      const box = document.createElement('div');
      box.className = 'ad-box';

      // BEGIN AADS AD UNIT 2451844
      const frame = document.createElement('div');
      frame.style.width = '100%';
      frame.style.margin = 'auto';
      frame.style.position = 'relative';
      frame.style.zIndex = '99998';

      const iframe = document.createElement('iframe');
      iframe.setAttribute('data-aa', '2451844');
      iframe.src = '//acceptable.a-ads.com/2451844/?size=Adaptive';
      iframe.style.border = '0';
      iframe.style.padding = '0';
      iframe.style.width = '70%';
      iframe.style.height = 'auto';
      iframe.style.overflow = 'hidden';
      iframe.style.display = 'block';
      iframe.style.margin = 'auto';

      frame.appendChild(iframe);
      box.appendChild(frame);
      // END AADS AD UNIT 2451844

      return box;
    }

    const top = document.getElementById('top-ads');
    const bottom = document.getElementById('bottom-ads');
    const topCount = Math.floor(TOTAL_ADS / 2);

    for (let i = 0; i < TOTAL_ADS; i++) {
      (i < topCount ? top : bottom).appendChild(createAd());
    }
  </script>
</body>
</html>
