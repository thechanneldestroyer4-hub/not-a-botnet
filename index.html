<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>notabotnet.site</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           AD WALL
           ========================= */

        .ad-wall {
            width: 100%;
        }

        .ad-container {
            width: 100%;
            min-height: 110px;
            margin: 0;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080808;
            border-bottom: 1px solid #111;
        }

        .ad-container iframe {
            border: 0;
            padding: 0;
            width: 70%;
            min-height: 90px;
            overflow: hidden;
            display: block;
            margin: auto;
        }

        /* =========================
           HERO
           ========================= */

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 3px,
                    rgba(255,255,255,0.015) 4px
                );
            pointer-events: none;
        }

        h1 {
            position: relative;
            margin: 0;
            font-size: clamp(45px, 9vw, 110px);
            line-height: 0.9;
            font-weight: 1000;
            letter-spacing: -5px;
            text-transform: uppercase;
        }

        .purple {
            color: #9b5cff;
            text-shadow:
                0 0 10px rgba(155, 92, 255, 0.8),
                0 0 40px rgba(155, 92, 255, 0.4);
        }

        .subtitle {
            position: relative;
            margin-top: 30px;
            color: #666;
            font-size: 18px;
        }

        .warning {
            position: relative;
            margin-top: 12px;
            color: #333;
            font-size: 12px;
        }

        /* =========================
           FOOTER
           ========================= */

        footer {
            text-align: center;
            padding: 50px 20px;
            color: #333;
            border-top: 1px solid #151515;
        }

        /* Mobile */

        @media (max-width: 700px) {
            .ad-container iframe {
                width: 95%;
            }

            .ad-container {
                min-height: 90px;
            }

            h1 {
                letter-spacing: -2px;
            }
        }
    </style>
</head>

<body>

    <!--
        NOTABOTNET.SITE
        Absolutely not a botnet.
    -->

    <div id="topAds" class="ad-wall"></div>

    <main class="hero">

        <h1>
            YOU JUST GOT<br>
            <span class="purple">BOTNETTED BOIIII</span>
        </h1>

        <div class="subtitle">
            welcome to notabotnet.site
        </div>

        <div class="warning">
            this website contains a frankly irresponsible amount of advertising
        </div>

    </main>

    <div id="bottomAds" class="ad-wall"></div>

    <footer>
        notabotnet.site<br><br>
        definitely not a botnet
    </footer>

    <script>
        /*
         * A-ADS UNIT
         * 2451844
         */

        const AD_COUNT = 60;

        const adHTML = `
            <div class="ad-container">
                <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                    <iframe
                        data-aa="2451844"
                        src="//acceptable.a-ads.com/2451844/?size=Adaptive"
                        loading="lazy"
                        style="
                            border:0;
                            padding:0;
                            width:70%;
                            height:auto;
                            min-height:90px;
                            overflow:hidden;
                            display:block;
                            margin:auto;
                        ">
                    </iframe>
                </div>
            </div>
        `;

        /*
         * Half the ads above the message,
         * half below it.
         */

        const topAds = document.getElementById("topAds");
        const bottomAds = document.getElementById("bottomAds");

        const topCount = Math.floor(AD_COUNT / 2);
        const bottomCount = AD_COUNT - topCount;

        for (let i = 0; i < topCount; i++) {
            topAds.insertAdjacentHTML("beforeend", adHTML);
        }

        for (let i = 0; i < bottomCount; i++) {
            bottomAds.insertAdjacentHTML("beforeend", adHTML);
        }
    </script>

</body>
</html>
