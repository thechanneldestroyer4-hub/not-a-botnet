<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>notabotnet.site</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* -----------------------------
           AD UNIT
        ----------------------------- */

        .ad-unit {
            width: 100%;
            min-height: 110px;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080808;
            border-bottom: 1px solid #141414;
        }

        .ad-unit iframe {
            border: 0;
            padding: 0;
            width: 70%;
            height: 100px; /* IMPORTANT: explicit height */
            display: block;
            margin: auto;
            overflow: hidden;
        }

        /* -----------------------------
           CENTRE MESSAGE
        ----------------------------- */

        .hero {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(155, 92, 255, 0.14),
                    transparent 40%
                ),
                #050505;
        }

        .hero-inner {
            max-width: 1100px;
        }

        h1 {
            margin: 0;
            font-size: clamp(42px, 9vw, 110px);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -0.06em;
            text-transform: uppercase;
        }

        .purple {
            color: #9b5cff;

            text-shadow:
                0 0 10px rgba(155, 92, 255, 0.8),
                0 0 35px rgba(155, 92, 255, 0.4);
        }

        .subtitle {
            margin-top: 28px;
            color: #777;
            font-size: 18px;
        }

        /* -----------------------------
           DESKTOP AD GRID
        ----------------------------- */

        .ad-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            background: #111;
        }

        .ad-grid .ad-unit {
            min-width: 0;
        }

        /* -----------------------------
           FOOTER
        ----------------------------- */

        footer {
            padding: 50px 20px;
            text-align: center;
            color: #333;
            font-size: 12px;
        }

        /* -----------------------------
           MOBILE
        ----------------------------- */

        @media (max-width: 700px) {
            .ad-grid {
                grid-template-columns: 1fr;
            }

            .ad-unit iframe {
                width: 95%;
                height: 100px;
            }

            .hero {
                min-height: 60vh;
            }
        }
    </style>
</head>

<body>

    <!--
    ============================================================
    TOP ADS
    ============================================================
    -->

    <div id="top-ads" class="ad-grid"></div>


    <!--
    ============================================================
    MAIN MESSAGE
    ============================================================
    -->

    <main class="hero">

        <div class="hero-inner">

            <h1>
                YOU JUST GOT<br>
                <span class="purple">
                    BOTNETTED BOIIII
                </span>
            </h1>

            <div class="subtitle">
                welcome to notabotnet.site
            </div>

        </div>

    </main>


    <!--
    ============================================================
    BOTTOM ADS
    ============================================================
    -->

    <div id="bottom-ads" class="ad-grid"></div>


    <footer>
        notabotnet.site
    </footer>


    <script>
        /*
         * A-ADS configuration
         */

        const AADS_ID = "2451844";

        /*
         * Total number of units the page can eventually create.
         */
        const TOTAL_ADS = 100;

        /*
         * Only create this many initially.
         *
         * The rest are loaded when the visitor gets near
         * the existing ads, which avoids firing 100 requests
         * simultaneously.
         */
        const INITIAL_ADS = 8;

        /*
         * Number of additional units added per batch.
         */
        const BATCH_SIZE = 4;

        let adsCreated = 0;


        /*
         * Create one A-ADS unit.
         *
         * Note:
         * - Explicit HTTPS URL
         * - Explicit iframe height
         * - No duplicate id="frame"
         */

        function createAd() {

            const container = document.createElement("div");

            container.className = "ad-unit";

            container.innerHTML = `
                <!-- BEGIN AADS AD UNIT 2451844 -->

                <div style="
                    width: 100%;
                    margin: auto;
                    position: relative;
                    z-index: 99998;
                ">

                    <iframe
                        data-aa="${AADS_ID}"
                        src="https://acceptable.a-ads.com/${AADS_ID}/?size=Adaptive"
                        style="
                            border:0;
                            padding:0;
                            width:70%;
                            height:100px;
                            overflow:hidden;
                            display:block;
                            margin:auto;
                        ">
                    </iframe>

                </div>

                <!-- END AADS AD UNIT 2451844 -->
            `;

            return container;
        }


        /*
         * Add another batch of advertisements.
         */

        function addAds(count) {

            const top = document.getElementById("top-ads");
            const bottom = document.getElementById("bottom-ads");

            for (let i = 0; i < count && adsCreated < TOTAL_ADS; i++) {

                const ad = createAd();

                /*
                 * Alternate between top and bottom so the
                 * central message remains visible.
                 */

                if (adsCreated % 2 === 0) {
                    top.appendChild(ad);
                } else {
                    bottom.appendChild(ad);
                }

                adsCreated++;
            }
        }


        /*
         * Initial batch.
         */

        addAds(INITIAL_ADS);


        /*
         * Sentinel used for lazy loading.
         */

        const sentinel = document.createElement("div");

        sentinel.style.height = "1px";

        document.body.appendChild(sentinel);


        /*
         * Load more advertisements as the visitor approaches
         * the end of the page.
         */

        const observer = new IntersectionObserver(
            entries => {

                if (!entries[0].isIntersecting) {
                    return;
                }

                if (adsCreated >= TOTAL_ADS) {
                    observer.disconnect();
                    return;
                }

                addAds(BATCH_SIZE);

            },
            {
                rootMargin: "1200px"
            }
        );


        observer.observe(sentinel);

    </script>

</body>
</html>
